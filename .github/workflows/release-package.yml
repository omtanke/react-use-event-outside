name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    env:
      # setup-node fills an empty NODE_AUTH_TOKEN with a placeholder, so check the secret separately
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Skip npmjs.org publish
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN secret is not set, skipping npmjs.org publish"
      - uses: actions/checkout@v4
        if: env.HAS_NPM_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
        if: env.HAS_NPM_TOKEN == 'true'
      - name: Publish to npmjs.org
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
